[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelbit-floweon-connector-ozon"
version = "0.3.0"
description = "Коннектор Ozon Seller API для Интелбит.Фловеон"
authors = [{ name = "Святослав Михайлов", email = "vceo@intelbit.ru" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-httpx",
    "respx",
    "fakeredis",
    "fastapi",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/SvyatoslavMikhailov/intelbit-floweon-connector-ozon"
Repository = "https://github.com/SvyatoslavMikhailov/intelbit-floweon-connector-ozon"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 — кириллические «двойники» в идентификаторах/докстрингах/комментариях.
# Проект ведёт комментарии по-русски, правила дают ложные срабатывания.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "contract: end-to-end contract-тесты против FastAPI-мока Ozon (ASGITransport)",
]
