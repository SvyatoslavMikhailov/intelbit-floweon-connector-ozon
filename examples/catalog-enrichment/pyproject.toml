[project]
name = "intelbit-floweon-vitrina-enrichment-script"
version = "0.1.0"
description = "Разовое ETL-обогащение каталога 1С-Битрикс БУС данными из Ozon"
requires-python = ">=3.12"
dependencies = [
    "intelbit-floweon-connector-ozon",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "fastapi"]

[tool.uv]
package = false

[tool.uv.sources]
intelbit-floweon-connector-ozon = { path = "../..", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
